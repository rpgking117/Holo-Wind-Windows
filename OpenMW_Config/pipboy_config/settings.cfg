# OpenMW settings for Pip-Boy streaming (Windows)
# Resolution matches Pip-Boy render target (1024x1024).
# Keep window visible but behind FO4; never minimize.

[Video]
resolution x = 1024
resolution y = 1024
fullscreen = false
window mode = 1
minimize on focus loss = false

[Input]
grab cursor = false

[HUD]
crosshair = false
